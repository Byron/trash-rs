name: Rust

on:
  push:
    branches: [ master, dev-v2 ]
  pull_request:
    branches: [ master, dev-v2 ]

env:
  APP_ID: org.example.trash
  RUNTIME_VER: "25.08"
  FLATHUB_REPO_LINK: https://dl.flathub.org/repo/flathub.flatpakrepo
  FLATPAK_CARGO_GENERATOR_LINK: https://github.com/flatpak/flatpak-builder-tools/raw/74697c75b630d7330e77250fc13cb5ea688d9479/cargo/flatpak-cargo-generator.py

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows, netbsd]
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - build: netbsd
            os: ubuntu-22.04
            target: x86_64-unknown-netbsd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          target: ${{ matrix.target }}

      - name: Use Cross
        shell: bash
        run: |
          cargo install cross
          echo "CARGO=cross" >> $GITHUB_ENV
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV

      - name: Show command used for Cargo
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "target flag is: ${{ env.TARGET_FLAGS }}"
          echo "target dir is: ${{ env.TARGET_DIR }}"

      - name: cargo test
        if: ${{ !startsWith(matrix.build, 'netbsd') }}
        run: ${{ env.CARGO }} test --verbose ${{ env.TARGET_FLAGS }}

      - name: cargo test (container tests)
        if: ${{ matrix.build == 'linux' }}
        # Grant the tests (running inside the cross docker container) access to the host's docker socket
        env:
          CROSS_CONTAINER_OPTS: -v /var/run/docker.sock:/var/run/docker.sock -e DOCKER_HOST=unix:///var/run/docker.sock
          CROSS_CONTAINER_UID: "0"
          CROSS_CONTAINER_GID: "0"
          CROSS_CONTAINER_USER_NAMESPACE: none
        run: ${{ env.CARGO }} test --verbose --test freedesktop_tests ${{ env.TARGET_FLAGS }} -- --ignored

      - name: cargo test (portal)
        if: ${{ matrix.build == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus xdg-desktop-portal
          dbus-run-session -- cargo test --verbose --no-default-features --features portal ${{ env.TARGET_FLAGS }}

      - name: cargo test (without chrono)
        if: ${{ startsWith(matrix.build, 'linux') }}
        run: ${{ env.CARGO }} test --verbose --no-default-features --features coinit_apartmentthreaded,freedesktop ${{ env.TARGET_FLAGS }}

      - name: cargo test (without chrono)
        if: ${{ startsWith(matrix.build, 'windows') }}
        run: ${{ env.CARGO }} test --verbose --no-default-features --features coinit_apartmentthreaded ${{ env.TARGET_FLAGS }}

      - name: cargo test (without chrono)
        if: ${{ startsWith(matrix.build, 'macos') }}
        run: ${{ env.CARGO }} test --verbose --no-default-features --features coinit_apartmentthreaded ${{ env.TARGET_FLAGS }}

      - name: cargo build
        if: ${{ startsWith(matrix.build, 'netbsd') }}
        run: ${{ env.CARGO }} build --verbose ${{ env.TARGET_FLAGS }}

      - name: cargo build (without chrono)
        if: ${{ startsWith(matrix.build, 'netbsd') }}
        run: ${{ env.CARGO }} build --verbose --no-default-features --features coinit_apartmentthreaded,freedesktop ${{ env.TARGET_FLAGS }}

      - name: cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings

  flatpak_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-pip
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          pip install --user aiohttp tomlkit
          curl -fsSL -o .flatpak-cargo-generator.py "$FLATPAK_CARGO_GENERATOR_LINK"
          mv tests/$APP_ID.yml $APP_ID.yml

      - name: Install runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub "$FLATHUB_REPO_LINK"
          flatpak install --user -y flathub \
            org.freedesktop.Platform//$RUNTIME_VER \
            org.freedesktop.Sdk//$RUNTIME_VER \
            org.freedesktop.Sdk.Extension.rust-stable//$RUNTIME_VER

      - name: Generate cargo-sources.json
        run: |
          [ -f Cargo.lock ] || cargo generate-lockfile
          python3 .flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json

      - name: Build .flatpak
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --repo=repo build-dir "$APP_ID.yml"
          mkdir -p dist
          flatpak build-bundle repo dist/trash.flatpak "$APP_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: trash-flatpak
          path: dist/trash.flatpak
          if-no-files-found: error

  flatpak_test:
    needs: flatpak_build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trash-flatpak
          path: dist

      - name: Install Flatpak and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xdg-desktop-portal dbus
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub "$FLATHUB_REPO_LINK"
          flatpak install --user -y flathub org.freedesktop.Platform//$RUNTIME_VER
          flatpak install --user -y dist/trash.flatpak

      - name: Test .flatpak with Portal
        run: |
          mkdir -p ~/trash-test
          touch ~/trash-test/remove-me
          mkdir ~/trash-test/remove-me-too

          dbus-run-session -- bash -euxc '
            for f in remove-me remove-me-too; do
              timeout 60 flatpak run "$APP_ID" delete "$HOME/trash-test/$f"
              test ! -e "$HOME/trash-test/$f"
            done
          '
